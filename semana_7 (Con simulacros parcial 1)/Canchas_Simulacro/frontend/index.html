<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de reservas</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"/>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        </script> 

        <script src="./js/scripts.js"></script>
    </head>
    
    <body style="font-family: Arial, Helvetica, sans-serif">
        <!-- #1 -->
        <div class="container p-3 my-3 border">
            <h2>Consulta de reservas</h2>
            <hr>   
            <!-- #2 -->
            <div class="container p-1 my-1 border">
                <form id="formConsultar" class="row g-3 mb-5">
                    <!-- #4 -->
                    <div class="col-md-6">
                        <label for="inputNombreJugador" class="form-label">Jugador</label>
                        <input type="text" class="form-control" id="inputNombreJugador" maxlength="30">
                    </div>
                    <!-- #5 -->
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="button" id="btnConsultar" class="btn btn-primary w-100" 
                            onclick="RecuperarReservas(inputNombreJugador.value)">Consultar</button>
                    </div>
                </form>
            </div>
            
            <!-- #3 -->
            <div class="container p-1 my-1 border">
                <h3>Reservas agendadas</h3>
                <table class="table table-striped table-hover container-x table-bordered">
                    <thead>
                        <tr>
                            <th scope="col">Id de Reserva</th>
                            <th scope="col">Fecha de Reserva</th>
                            <th scope="col">Jugador</th>
                            <th scope="col"># de Cancha</th>
                            <th scope="col">Horas</th>
                            <th scope="col">Pagada</th>
                            <th scope="col">Importe</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyReservas">
                    
                    </tbody>
                </table>
            </div>
        </div>
        <footer
            class="footer-dark bg-dark text-light justify-content-between align-items-center py-3 border-top">
            <span class="m-3 mb-3 mb-md-0">
                © 2025 Desarrollo de Software, UTN FRC, Córdoba, Argentina.
            </span>
        </footer>
    </body>
</html>
