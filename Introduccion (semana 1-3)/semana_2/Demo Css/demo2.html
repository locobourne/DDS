<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="estilos2.css">
  <style>
    h1 {
      color: blue;
    }
  </style>
  <title>Hola Mundo</title>
</head>
<body>
  <!-- Paso 3: se quitó el estilo inline -->
  <h1 class="text">Hola Mundo</h1>

  <!-- Paso 4: se agregó id="miparrafo" -->
  <!-- Paso 1: se quitó el fondo amarillo inline -->
  <p id="miparrafo">Mi primer documento html</p>

  <!-- Paso 2: clase text al párrafo, se quitó estilo inline -->
  <div>
    <p class="text" id="miparrafo">Texto en div con clase "text"</p>
    
    <!-- Paso 5: 2 labels dentro del div -->
    <label>Etiqueta 1 en div</label><br>
    <label>Etiqueta 2 en div</label>
  </div>

  <!-- Paso 5: 1 label fuera del div -->
  <label>Etiqueta fuera del div</label>
</body>
</html>
