<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Padel - Gestion de reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link href="reservas.css" rel="stylesheet">
</head>

<body>
  <div class="container p-3 my-3 border">
    <h2>Mega Padel - Gestión de reservas</h2>
    <hr>


    <div class="mb-4">
      <h3>Reservas agendadas</h3>
      <table class="table table-striped table-hover mt-2">
        <thead>
          <tr>
            <th scope="col">Fecha</th>
            <th scope="col">Hora</th>
            <th scope="col">Cancha</th>
            <th scope="col">Jugador</th>
          </tr>
        </thead>
        <tbody id="tbodyReservas"></tbody>
      </table>
    </div>

    <div class="mb-4">
      <h3>Agregar reservas</h3>
      <form id="formularioReserva" class="row g-3">
        <div class="col-md-6">
          <label for="inputFecha" class="form-label">Fecha</label>
          <input type="date" class="form-control" id="inputFecha" required>
        </div>

        <div class="col-md-6">
          <label for="inputHora" class="form-label">Hora</label>
          <input type="number" class="form-control" id="inputHora" min="0" max="24" required>
        </div>

        <div class="col-md-12">
          <label for="inputCancha" class="form-label">Cancha</label>
          <input type="number" class="form-control" id="inputCancha" min="1" max="4" required>
        </div>

        <div class="col-md-12">
          <label for="inputJugador" class="form-label">Jugador</label>
          <input type="text" class="form-control" id="inputJugador" maxlength="30" required>
        </div>

        <div class="col-md-4 d-flex align-items-end">
          <button type="button" id="btnAgregar" class="btn btn-primary w-100">Agregar reserva</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="reservas.js"></script>
</body>


</html>
