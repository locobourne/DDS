<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mis Datos - BiciAlquileres</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Mis Datos</h1>
      <button type="button" class="btn btn-primary">Editar Perfil</button>
    </div>

    <section class="d-flex align-items-start gap-4">
      <img 
        src="https://via.placeholder.com/150" 
        alt="Foto de perfil" 
        class="rounded-circle border border-secondary" 
        width="150" 
        height="150" 
      />

      <div class="flex-grow-1">
        <h2 class="mb-1">Juan</h2>
        <h3 class="mb-4 text-secondary">Pérez</h3>

        <form>
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-control" value="juan.perez@example.com" disabled />
          </div>
          <div class="mb-3">
            <label for="fechaNac" class="form-label">Fecha de nacimiento</label>
            <input type="date" id="fechaNac" class="form-control" value="1990-04-15" disabled />
          </div>
          <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="tel" id="telefono" class="form-control" value="+54 351 123-4567" disabled />
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
